name: Android Launcher APK

on:
  push:
    paths:
      - "AndroidLauncher/**"
      - ".github/workflows/android-launcher.yml"
  pull_request:
    paths:
      - "AndroidLauncher/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AndroidLauncher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MiLauncher-apk
          path: AndroidLauncher/app/build/outputs/apk/debug/app-debug.apk
